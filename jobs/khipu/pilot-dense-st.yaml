# Fase pilot do khipu: dense_st, K=1024, tau=0.1 1 10 (escala median),
# seeds 0: 3 execuções de 20000 passos, em sequência, na mesma GPU.
#
#   sauron submit -c jobs/khipu/pilot-dense-st.yaml jobs/khipu/job.sh
#
# Reenviar este job retoma do último checkpoint e pula o que já concluiu (run_group.sh --resume).
#
# max_time 1h: 1ª ESTIMATIVA, de 40 ms/passo x 3 execuções x 20000 passos x 1.3
# de folga. O ms/passo NÃO é medido no sauron (ver notes/fase2_khipu.md); estourar é barato.
# memory 8g: 1ª ESTIMATIVA, sem pico medido. Reajustar por `RAM do job:` no log do 1º job.
name: khipu-pilot-dense-st
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89     # menor classe; o VQ-VAE é pequeno e o job gasta 89 GB da cota de qualquer jeito
memory: 8g
cpus: 2
max_time: 1h

workspace: Gate-VQ-VAE

env:
  EXP: "khipu"
  ESTIMATORS: "dense_st"
  SEEDS: "0"
  KS: "1024"
  TAUS: "0.1 1 10"
  TAU_SCALE: "median"
