# Fase pilot do khipu: gate_norm, K=1024, tau=0.1 1 10 (escala median),
# seeds 0: 3 execuções de 20000 passos, em sequência, na mesma GPU.
#
#   sauron submit -c jobs/khipu/pilot-gate-norm.yaml jobs/khipu/job.sh
#
# Reenviar este job retoma do último checkpoint e pula o que já concluiu (run_group.sh --resume).
#
# max_time 1h: de 25 ms/passo x 3 execuções x 20000 passos x 1.3 de folga.
#   Medido no smoke (job #3343, B200 MIG 89 GB, 200 passos incl. 1 avaliação): ste 14,9/17,1 e gate_cb 16,5/20,3 ms/passo em K=1024/8192; 25 arredonda para cima (gate_norm e dense_st não medidos).
# memory 3g: pico medido 1,6 GiB no smoke (#3343, 4 execuções, K até 8192); pico/0,7 = 2,3 -> 3g.
name: khipu-pilot-gate-norm
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89     # menor classe; o VQ-VAE é pequeno e o job gasta 89 GB da cota de qualquer jeito
memory: 3g
cpus: 2
max_time: 1h

workspace: Gate-VQ-VAE

env:
  EXP: "khipu"
  ESTIMATORS: "gate_norm"
  SEEDS: "0"
  KS: "1024"
  TAUS: "0.1 1 10"
  TAU_SCALE: "median"
