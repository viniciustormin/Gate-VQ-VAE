# Fase main do khipu: gate_norm, K=1024, tau=1 (escala median),
# seeds 0 1 2: 3 execuções de 20000 passos, em sequência, na mesma GPU.
#
#   sauron submit -c jobs/khipu/main-gate-norm.yaml jobs/khipu/job.sh
#
# Reenviar este job retoma do último checkpoint e pula o que já concluiu (run_group.sh --resume).
#
# tau escolhido pelo Vinícius a partir do piloto (notes/fase2_khipu.md):
# por estimador, seleção no conjunto de teste, seed 0.
#
# max_time 30m: 10 ms/passo x 3 execuções x 20000 passos x 1.3 de folga.
#   Medido no piloto (jobs #3344-#3346, B200 MIG 89 GB): 7,6 a 8,6 ms/passo em K=1024 (20k passos completos, com 10 avaliações); 10 arredonda para cima (ste e ste_ema não medidos em 20k passos).
# memory 3g: pico medido 1,5 a 1,6 GiB no piloto (#3344-#3346): 52-53% de 3g, dentro da faixa de 50-90%.
name: khipu-main-gate-norm
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89     # menor classe; o VQ-VAE é pequeno e o job gasta 89 GB da cota de qualquer jeito
memory: 3g
cpus: 2
max_time: 30m

workspace: Gate-VQ-VAE

env:
  EXP: "khipu"
  ESTIMATORS: "gate_norm"
  SEEDS: "0 1 2"
  KS: "1024"
  TAUS: "1"
  TAU_SCALE: "median"
