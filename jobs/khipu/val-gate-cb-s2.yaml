# Fase val do khipu: gate_cb, K=1024, tau=0.01 0.03 0.1 0.3 1 3 10 (escala median),
# seeds 2: 7 execuções de 20000 passos, em sequência, na mesma GPU.
#
#   sauron submit -c jobs/khipu/val-gate-cb-s2.yaml jobs/khipu/job.sh
#
# Reenviar este job retoma do último checkpoint e pula o que já concluiu (run_group.sh --resume).
#
# Varredura de tau por VALIDAÇÃO (5000 imagens do treino):
# notes/followup_ressalvas.md.
#
# max_time 30m: 9 ms/passo x 7 execuções x 20000 passos x 1.3 de folga.
#   Medido na grade (jobs #3349-#3353): 6,9 a 8,6 ms/passo em K=1024 (20k passos completos); 9 arredonda para cima. 7 execuções por job.
# memory 3g: pico medido 1,3 a 1,6 GiB na grade (#3349-#3356): 3g.
name: khipu-val-gate-cb-s2
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89     # menor classe; o VQ-VAE é pequeno e o job gasta 89 GB da cota de qualquer jeito
memory: 3g
cpus: 2
max_time: 30m

workspace: Gate-VQ-VAE

env:
  EXP: "khipu_val"
  ESTIMATORS: "gate_cb"
  SEEDS: "2"
  KS: "1024"
  TAUS: "0.01 0.03 0.1 0.3 1 3 10"
  TAU_SCALE: "median"
  EXTRA_OVERRIDES: "data.holdout=5000"
