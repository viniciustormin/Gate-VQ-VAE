# Fase rerun do khipu: dense_st, K=8192, tau=0.03 (escala median),
# seeds 0 1 2: 3 execuções de 20000 passos, em sequência, na mesma GPU.
#
#   sauron submit -c jobs/khipu/rerun-dense-st-k8192.yaml jobs/khipu/job.sh
#
# Reenviar este job retoma do último checkpoint e pula o que já concluiu (run_group.sh --resume).
#
# Reexecução: tau escolhido por VALIDAÇÃO (scripts/select_tau.py) que difere do
# usado na grade principal; ver notes/followup_ressalvas.md.
#
# max_time 30m: 12 ms/passo x 3 execuções x 20000 passos x 1.3 de folga.
#   Medido na grade e na varredura (jobs #3349-#3410): 6,9 a 11,4 ms/passo; 12 arredonda para cima (K=8192 é o mais lento). 3 execuções por job (a seed 0 de gate_norm tau 0,1 já existe do piloto e é pulada).
# memory 3g: pico medido 1,3 a 1,6 GiB em todos os jobs da grade e da varredura (#3349-#3410): 3g.
name: khipu-rerun-dense-st-k8192
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89     # menor classe; o VQ-VAE é pequeno e o job gasta 89 GB da cota de qualquer jeito
memory: 3g
cpus: 2
max_time: 30m

workspace: Gate-VQ-VAE

env:
  EXP: "khipu"
  ESTIMATORS: "dense_st"
  SEEDS: "0 1 2"
  KS: "8192"
  TAUS: "0.03"
  TAU_SCALE: "median"
